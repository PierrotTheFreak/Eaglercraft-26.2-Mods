name: CompileHtml

on:
  push:
    paths-ignore:
      - 'output/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: compile-html-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  compile-html:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GRADLE_OPTS: "-Xms4g -Xmx15g -XX:MaxMetaspaceSize=2g -XX:+UseG1GC"
      JAVA_TOOL_OPTIONS: "-Xms4g -Xmx15g -XX:MaxMetaspaceSize=2g -XX:+UseG1GC"
      BRANCH_NAME: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Generate production assets EPK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :target_lwjgl_desktop:buildAssetsEPK --console=plain --no-daemon
          EPK="$(find target_lwjgl_desktop/build -type f -name 'assets.epk' -print -quit)"
          if [ -z "$EPK" ]; then
            echo "::error::buildAssetsEPK completed but no assets.epk was produced"
            find . -type f -name '*.epk' -not -path './.git/*' -print | sort
            exit 1
          fi
          echo "EPK=$EPK" >> "$GITHUB_ENV"

      - name: Compile TeaVM JavaScript client
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :target_teavm:generateJavaScript --console=plain --no-daemon
          JS="$(find target_teavm/build -type f -name 'classes.js' -print -quit)"
          if [ -z "$JS" ]; then
            echo "::error::generateJavaScript completed but no classes.js was produced"
            find target_teavm/build -type f | sort | head -300
            exit 1
          fi
          echo "TEAVM_JS=$JS" >> "$GITHUB_ENV"

      - name: Compile TeaVM WASM-GC client
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :target_teavm_wasm_gc:generateWasmGC --console=plain --no-daemon
          WASM="$(find target_teavm_wasm_gc/build -type f -name 'classes.wasm' -print -quit)"
          if [ -n "$WASM" ]; then
            echo "TEAVM_WASM=$WASM" >> "$GITHUB_ENV"
            echo "WASM-GC output: $WASM"
          else
            echo "WASM-GC task completed without classes.wasm; continuing with JS."
          fi

      - name: Assemble browser client
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          cp "$TEAVM_JS" "output/$BRANCH_NAME.js"
          cp "$EPK" "output/$BRANCH_NAME.epk"

          if [ -n "${TEAVM_WASM:-}" ]; then
            cp "$TEAVM_WASM" "output/$BRANCH_NAME.wasm"
          fi

          cat > "output/$BRANCH_NAME.html" <<'HTML'
          <!DOCTYPE html>
          <html lang="en" style="width:100%;height:100%;background:#000;">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <meta name="description" content="Eaglercraft 26.2">
            <title>Eaglercraft 26.2</title>
            <script type="text/javascript" src="__BRANCH__.js"></script>
            <script type="text/javascript">
              window.addEventListener("load", function() {
                if (document.location.href.startsWith("file:")) {
                  alert("HTTP is required. Run this client through an HTTP server.");
                  return;
                }
                window.eaglercraftXOpts = {
                  container: "game_frame",
                  assetsURI: "__BRANCH__.epk",
                  localesURI: "lang/",
                  worldsDB: "worlds"
                };
                main();
              });
            </script>
          </head>
          <body style="margin:0;width:100vw;height:100vh;overflow:hidden;" id="game_frame"></body>
          </html>
          HTML

          sed -i "s/__BRANCH__/$BRANCH_NAME/g" "output/$BRANCH_NAME.html"

          echo "Built browser client:"
          ls -lh "output/$BRANCH_NAME.html" "output/$BRANCH_NAME.js" "output/$BRANCH_NAME.epk"
          if [ -f "output/$BRANCH_NAME.wasm" ]; then
            ls -lh "output/$BRANCH_NAME.wasm"
          fi

      - name: Commit browser build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "output/$BRANCH_NAME.html" "output/$BRANCH_NAME.js" "output/$BRANCH_NAME.epk" "output/$BRANCH_NAME.wasm" 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Browser build is unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "Build $BRANCH_NAME browser client"
          git push origin "HEAD:$BRANCH_NAME"
