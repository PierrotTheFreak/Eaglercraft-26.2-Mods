name: CompileHtml

on:
  push:
    paths-ignore:
      - 'output/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: compile-html-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  compile-html:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GRADLE_OPTS: "-Xms4g -Xmx15g -XX:MaxMetaspaceSize=2g -XX:+UseG1GC"
      JAVA_TOOL_OPTIONS: "-Xms4g -Xmx15g -XX:MaxMetaspaceSize=2g -XX:+UseG1GC"
      BRANCH_NAME: ${{ github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Verify build tasks
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :target_lwjgl_desktop:tasks --all --console=plain | grep -E 'buildAssetsEPK' || {
            echo "::error::buildAssetsEPK task is missing"
            exit 1
          }
          ./gradlew :target_teavm:tasks --all --console=plain | grep -E 'generateJavaScript' || {
            echo "::error::generateJavaScript task is missing"
            exit 1
          }

      - name: Generate production assets EPK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :target_lwjgl_desktop:buildAssetsEPK --console=plain --no-daemon

          EPK="target_lwjgl_desktop/build/epk/assets.epk"
          if [ ! -f "$EPK" ]; then
            echo "::error::Expected EPK was not produced: $EPK"
            find . -type f -name '*.epk' -not -path './.git/*' -print | sort
            exit 1
          fi

          echo "EPK=$EPK" >> "$GITHUB_ENV"
          echo "Generated $EPK"

      - name: Compile verified TeaVM JavaScript client
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :target_teavm:generateJavaScript --console=plain --no-daemon

          JS="$(find target_teavm/build -type f -name 'classes.js' -print -quit)"
          if [ -z "$JS" ]; then
            echo "::error::generateJavaScript completed but classes.js was not found"
            find target_teavm/build -type f | sort | head -300
            exit 1
          fi

          echo "TEAVM_JS=$JS" >> "$GITHUB_ENV"
          echo "Generated $JS"

      - name: Optional WASM-GC build
        continue-on-error: true
        shell: bash
        run: |
          set +e
          ./gradlew :target_teavm_wasm_gc:generateWasmGC --console=plain --no-daemon
          STATUS=$?

          if [ "$STATUS" -ne 0 ]; then
            echo "::warning::WASM-GC build failed; JavaScript release build will still be published."
            exit 0
          fi

          WASM="$(find target_teavm_wasm_gc/build -type f -name 'classes.wasm' -print -quit)"
          if [ -n "$WASM" ]; then
            cp "$WASM" "output/$BRANCH_NAME.wasm"
            echo "WASM-GC output: $WASM"
          else
            echo "::warning::WASM-GC task succeeded but classes.wasm was not found."
          fi

      - name: Assemble browser client
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output

          cp "$TEAVM_JS" "output/$BRANCH_NAME.js"
          cp "$EPK" "output/$BRANCH_NAME.epk"

          cat > "output/$BRANCH_NAME.html" <<'HTML'
          <!DOCTYPE html>
          <html lang="en" style="width:100%;height:100%;background:#000;">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <meta name="description" content="Eaglercraft 26.2">
            <title>Eaglercraft 26.2 - __BRANCH__</title>
            <script type="text/javascript" src="__BRANCH__.js"></script>
            <script type="text/javascript">
              window.addEventListener("load", function() {
                window.eaglercraftXOpts = {
                  container: "game_frame",
                  assetsURI: "__BRANCH__.epk",
                  worldsDB: "eaglercraftx-__BRANCH__-worlds"
                };
                main();
              });
            </script>
          </head>
          <body style="margin:0;width:100vw;height:100vh;overflow:hidden;background:#000;" id="game_frame"></body>
          </html>
          HTML

          sed -i "s/__BRANCH__/$BRANCH_NAME/g" "output/$BRANCH_NAME.html"

          echo "========================================"
          echo "Built browser client for $BRANCH_NAME"
          echo "========================================"
          ls -lh "output/$BRANCH_NAME.html" "output/$BRANCH_NAME.js" "output/$BRANCH_NAME.epk"
          if [ -f "output/$BRANCH_NAME.wasm" ]; then
            ls -lh "output/$BRANCH_NAME.wasm"
          fi

      - name: Commit browser build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "output/$BRANCH_NAME.html"                   "output/$BRANCH_NAME.js"                   "output/$BRANCH_NAME.epk"

          if [ -f "output/$BRANCH_NAME.wasm" ]; then
            git add "output/$BRANCH_NAME.wasm"
          fi

          if git diff --cached --quiet; then
            echo "Browser build is unchanged; nothing to commit."
            exit 0
          fi

          git commit -m "Build $BRANCH_NAME browser client"
          git push origin "HEAD:$BRANCH_NAME"
