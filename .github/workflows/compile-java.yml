name: Compile Java

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-java:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Compile game Java
        run: ./gradlew :game:compileJava --console=plain --no-daemon
